submission:
  title: "TrialGuard — Clinical Trial Risk Monitor & Protocol Deviation Detector"  # REQUIRED

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Clinical trial monitors must oversee many sites, patients and scheduled visits, where
    protocol deviations such as missed or late visits, wrong doses and prohibited medications
    can go unnoticed until an audit. A flat list of individual deviations does not show which
    sites need attention first, why, or whether problems are getting worse.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    TrialGuard is a local Streamlit dashboard that compares patient visit records (synthetic
    demo data or an uploaded CSV) against a protocol using transparent Python rules. It detects
    and classifies deviations, scores each site's risk from 0 to 100, raises early warnings for
    repeated patterns and worsening trends, and generates a downloadable rule-based CAPA report
    with suggested corrective and preventive actions (prototype recommendations, not regulatory
    advice).

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Rule-based detection of missed visits, out-of-window visits, incorrect doses, prohibited medications and missing documentation, with Major/Minor/Administrative severity"
    - "Site-level 0-100 risk score normalised by site size, with a points breakdown and top contributing risk factors"
    - "Early warnings for repeated dosing errors, repeated prohibited medications, increasing deviation trends and unusually high deviation rates"
    - "Rule-based CAPA report per site, shown in the dashboard and downloadable as Markdown"
    - "Streamlit and Plotly dashboard with validated CSV upload and Completed vs Ongoing trial handling"

  tech_stack:
    languages: ["Python"]              # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["Streamlit"]          # e.g., ["FastAPI", "React"]
    ibm_technologies: []               # None used — TrialGuard does not use IBM Bob, watsonx.ai or other IBM technology
    databases: []                      # None — data is read from CSV and JSON files
    other: ["pandas", "Plotly", "pytest"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Transparency and traceability: every deviation shows its expected value, actual value and
    explanation; every severity label carries the rule that produced it; each site's risk
    points split exactly into named risk factors; warnings state why they fired; and CAPA issues
    are labelled as rule-based hypotheses. This is backed by 334 automated tests, including
    boundary tests for every threshold and headless tests of the real dashboard, and by input
    validation that turns broken uploads into clear messages instead of wrong results.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Proof-of-concept using synthetic data only; severity rules, risk weights, warning thresholds
    and CAPA actions are simplified prototype rules that are not clinically or regulatorily
    validated. Single protocol, study days instead of calendar dates, and one dose value. In
    Ongoing trial mode, visits a dropped-out patient never reached are not flagged. No
    authentication, database or audit trail; not performance-tested on large datasets; runs
    locally and is not deployed. No IBM technology is integrated.

